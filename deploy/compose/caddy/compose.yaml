name: singlepage

services:
  singlepage:
    build:
      context: ../../..
      dockerfile: deploy/dockerfile/Dockerfile
    image: singlepage:local
    restart: unless-stopped
    environment:
      SINGLEPAGE_TRUST_PROXY_HEADERS: "true"
    expose:
      - "8080"
    volumes:
      - singlepage-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      singlepage:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the public hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  singlepage-data:
  caddy-data:
  caddy-config:
