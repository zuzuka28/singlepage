name: singlepage

services:
  singlepage:
    build:
      context: ../../..
      dockerfile: deploy/dockerfile/Dockerfile
    image: singlepage:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - singlepage-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  singlepage-data:
